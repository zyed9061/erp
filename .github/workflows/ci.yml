name: Contrôles

on:
  push:
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Parcours complets contre un vrai serveur, avec une base embarquée neuve (aucun secret requis)
      - run: npm run e2e
